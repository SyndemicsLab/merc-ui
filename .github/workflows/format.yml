name: Check source code formatting

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
        # checkout@v6 - using commit hash
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        # setup-node@v6 - using commit hash
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
      - run: npm install
        # `npx prettier --check .` exits with a non-zero exit code if there are
        # style issues in any file
      - run: npx prettier --check .
